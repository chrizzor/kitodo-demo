<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
     xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
     xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
     xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers">

    <f:layout name="Content"/>

    <f:section name="Configuration">
        <flux:form id="startpageitem"
                   label="Kachel"
                   description="Kachel für die Startseite (Benötigt Wrapper-Element)">

            <!-- Insert fields, sheets, grid, form section objects etc. here, in this flux:flexform tag -->
            <flux:field.inline.fal name="image" minItems="0" maxItems="1" label="Bild"/>
            <flux:field.input name="headline" required="TRUE" label="Überschrift" />
            <flux:field.text name="teasertext" rows="5" cols="30" required="TRUE" label="Beschreibung" />
            <flux:field.input name="pagelink" label="Link" config="{renderType: 'inputLink'}" />
        </flux:form>
    </f:section>

    <f:section name="Preview">
        <table width="100%">
            <tr>
                <td width="50%">
                <td width="50%">
                    <f:format.crop maxCharacters="50">{teasertext}</f:format.crop>
                    <f:if condition="{pagelink}">
                        <strong>Link:</strong> {pagelink}
                    </f:if>
                </td>
            </tr>
        </table>
    </f:section>

    <f:section name="Main">
        <article class="home-newsarticle">
            <div class="home-newsarticle-inner">
                <f:link.typolink parameter="{pagelink}" title="{headline}">
                {v:content.resources.fal(field: 'image') -> v:iterator.first() -> v:variable.set(name: 'image')}
                <f:image treatIdAsReference="1" src="{image.id}" title="{image.title}" alt="{image.alternative}"/>
                <h2>{headline}</h2>
                <p><f:format.nl2br>{teasertext}</f:format.nl2br></p>
                <span class="home-button"><f:translate key="ulb-more" /></span>
                </f:link.typolink>
            </div>
        </article>
    </f:section>
</div>
