<div xmlns="http://www.w3.org/1999/xhtml" lang="en"
     xmlns:f="http://typo3.org/ns/TYPO3/Fluid/ViewHelpers"
     xmlns:v="http://typo3.org/ns/FluidTYPO3/Vhs/ViewHelpers"
     xmlns:flux="http://typo3.org/ns/FluidTYPO3/Flux/ViewHelpers"
     xmlns:pp="http://typo3.org/ns/Kitodo/PresentationPackage/ViewHelpers">

    <f:layout name="Default" />

    <f:section name="Configuration">
        <flux:form id="digitalisateDetail" label="Digitalisate Detail">
            <!-- Insert fields, sheets, grid, form section objects etc. here, in this flux:form tag -->
        </flux:form>

        <flux:grid>
            <!-- Edit this grid to change the "backend layout" structure -->
            <flux:grid.row>
                <flux:grid.column colPos="0" name="Titel" label="Titel" />
                <flux:grid.column colPos="8" name="Navigation" label="Pageview Navigation" />
                <flux:grid.column colPos="15" name="Basket" label="Basket" />
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="3" name="Docnavigation" label="Dokument Navigation" />
                <flux:grid.column colPos="4" name="TOC" label="TOC" />
                <flux:grid.column colPos="5" name="Metadaten" label="Metadaten" />
                <flux:grid.column colPos="6" name="Preview" label="Pageview Preview" />
                <flux:grid.column colPos="7" name="Toolbox" label="Toolbox" />
            </flux:grid.row>
            <flux:grid.row>
                <flux:grid.column colPos="1" colspan="5" name="Main" label="Main" />
            </flux:grid.row>
        </flux:grid>
    </f:section>

    <f:section name="Main">
        <header>
            <div class="header-wrapper">
                <section class="header-logo-area">
                    <article id="portal-logo">
                        <a href="/">
                            <img src="../../typo3conf/ext/presentation_package/Resources/Public/Images/logo-tudigit.png" alt="Universitäts- und Landesbibliothek Darmstadt">
                        </a>
                    </article>
                    <article id="ulb-logo">
                        <a href="https://www.ulb.tu-darmstadt.de/">
                            <img src="../../typo3conf/ext/presentation_package/Resources/Public/Images/ulb-logo.svg" alt="Universitäts- und Landesbibliothek Darmstadt">
                            <span>Universitäts- und<br>Landesbibliothek<br>Darmstadt</span>
                        </a>
                    </article>
                    <article id="tud-logo">
                        <a href="https://www.tu-darmstadt.de">
                            <img src="../../typo3conf/ext/presentation_package/Resources/Public/Images/tud-logo.svg" alt="Technische Universität Darmstadt">
                        </a>
                    </article>
                </section>
            </div>

            <section class="portal-main-search">
                <div class="header-wrapper">

                    <v:content.render column="0" />

                    <article class="breadcrumb breadcrumb-detailview">
                        <span>
                            <a href="/"><f:translate key="LLL:EXT:presentation_package/Resources/Private/Language/locallang.xlf:ulb-startpage"/></a>
                        </span>
                        <span id="backtolistview">
                            <a href="/"><f:translate key="LLL:EXT:presentation_package/Resources/Private/Language/locallang.xlf:ulb-hits"/></a>
                        </span>
                        <span>
                            Detail
                        </span>
                    </article>
                    <f:render partial="LanguageMenu" arguments="{_all}"/>
                </div>
            </section>

        </header>

        <header>
            <section class="portal-meta">
                <article class="breadcrumb">
                    <f:comment>
                        <v:page.breadCrumb class="breadcrumb" tagName="article" tagNameChildren="span"/>
                    </f:comment>
                </article>
            </section>
        </header>

        <main class="clear" id="detail-view">
            <aside>
                <section>
                    <div class="detail-aside-nav">
                        <v:content.render column="3" />
                        <v:content.render column="7" />
                    </div>
                </section>

                <article class="detail-view-itemoptions">
                    <!-- Metadaten -->
                    <v:content.render column="5" />
                    <!-- Inhaltsverzeichnis -->
                    <v:content.render column="4" />
                </article>
            </aside>

            <section id="main-content">
                <div class="detail-view-main">
                    <article class="detail-view-header">
                        <div id="c9" class="detail-view-title">
                            <div class="tx-dlf-metadata">
                                <dl>
                                    <dt class="tx-dlf-metadata-title"></dt>
                                    <dd class="tx-dlf-metadata-title detail-view-title-main"></dd>
                                </dl>
                            </div>
                        </div>

                        <div class="detail-view-nav">
                            <v:content.render column="8" />
                        </div>
                    </article>
                    <v:content.render column="1" />
                </div>
                <div class="fullsize-pagegrid" style="display: none;">
                    <v:content.render column="6" />
                </div>
            </section>
        </main>

        <f:comment>
            <f:render partial="Footer"/>
        </f:comment>
    </f:section>

</div>
